version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: clipflow-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: clipflow
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'

  redis:
    image: redis:7-alpine
    container_name: clipflow-prod-redis
    restart: always
    volumes:
      - redis_prod_data:/data
    ports:
      - '6380:6379'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clipflow-prod-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/clipflow?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3001
      FRONTEND_URL: http://localhost
    depends_on:
      - postgres
      - redis
    command: sh -c "npx prisma db push && node dist/index.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost
    container_name: clipflow-prod-frontend
    restart: always
    environment:
      PORT: 3000
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: clipflow-prod-nginx
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_prod_data:
  redis_prod_data:
