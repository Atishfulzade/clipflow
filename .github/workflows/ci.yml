name: ClipFlow AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: clipflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    # 1. Backend Checks
    - name: Install Backend Dependencies
      run: |
        cd backend
        npm install

    - name: Validate Prisma Schema
      run: |
        cd backend
        npx prisma validate

    - name: Compile Backend TypeScript
      run: |
        cd backend
        npm run build

    # 2. Frontend Checks
    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install

    - name: Compile Frontend Next.js
      run: |
        cd frontend
        npm run build

    # 3. Docker Compose Checks
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Verify Docker Compose Build
      run: |
        docker compose -f docker-compose.prod.yml build
